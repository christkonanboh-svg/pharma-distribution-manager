{% load static %}
<!doctype html>
<html lang="fr" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="DPCI — plateforme de gestion des commandes, du stock et de la traçabilité pharmaceutique.">
  <title>{% block title %}DPCI{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-full bg-slate-50 text-slate-900" x-data="{ sidebarOpen: false }" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% include "partials/icons.html" %}
  {% block layout %}
    <div class="relative min-h-screen overflow-x-hidden">
      <div class="pointer-events-none fixed inset-0 -z-10">
        <div class="absolute inset-0 bg-grid opacity-60"></div>
        <div class="absolute -left-40 top-0 h-[28rem] w-[28rem] rounded-full bg-brand-200/30 blur-3xl"></div>
        <div class="absolute -right-40 top-1/3 h-[26rem] w-[26rem] rounded-full bg-sky-200/20 blur-3xl"></div>
      </div>

      {% include "partials/sidebar.html" %}

      <div class="min-h-screen lg:pl-[272px]">
        {% include "partials/topbar.html" %}
        <main class="relative mx-auto w-full max-w-[1600px] px-4 pb-12 pt-6 sm:px-6 lg:px-8 lg:pt-8">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
  {% endblock %}

  <div id="toast-root" class="pointer-events-none fixed bottom-5 right-5 z-[90] flex w-full max-w-sm flex-col items-end gap-3" aria-live="polite"></div>

  <script src="{% static 'vendor/htmx.min.js' %}"></script>
  <script src="{% static 'vendor/chart.umd.min.js' %}"></script>
  <script src="{% static 'vendor/alpine.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
