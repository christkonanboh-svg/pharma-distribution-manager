{% load dpci %}
<div
  x-cloak
  x-show="$store.cart.open"
  x-effect="document.body.classList.toggle('overflow-hidden', $store.cart.open)"
  @keydown.escape.window="$store.cart.closeDrawer()"
  class="fixed inset-0 z-[80]"
  role="dialog"
  aria-modal="true"
  aria-label="Panier de commande"
>
  <div
    class="absolute inset-0 bg-navy-950/45 backdrop-blur-[2px]"
    x-show="$store.cart.open"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click="$store.cart.closeDrawer()"
  ></div>

  <aside
    class="absolute right-0 top-0 flex h-full w-full max-w-md flex-col bg-white shadow-2xl"
    x-show="$store.cart.open"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="translate-x-full"
    x-transition:enter-end="translate-x-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="translate-x-0"
    x-transition:leave-end="translate-x-full"
  >
    <header class="flex items-start justify-between gap-4 border-b border-hairline px-5 py-4">
      <div>
        <p class="text-[10px] font-bold uppercase tracking-[0.16em] text-brand-700">Commande</p>
        <h2 class="mt-0.5 flex items-center gap-2 text-lg font-extrabold tracking-tight text-navy-900">
          Votre panier
          <span x-cloak x-show="$store.cart.count > 0" x-text="'(' + $store.cart.count + ')'" class="text-sm font-semibold text-slate-500"></span>
        </h2>
      </div>
      <button type="button" class="btn-icon -mr-1 shrink-0" @click="$store.cart.closeDrawer()" aria-label="Fermer le panier">
        <svg class="icon-sm h-4 w-4"><use href="#i-x"></use></svg>
      </button>
    </header>

    <div class="flex-1 overflow-y-auto px-5 py-4">
      <template x-if="$store.cart.items.length === 0">
        <div class="flex h-full flex-col items-center justify-center py-12 text-center">
          <span class="grid h-16 w-16 place-items-center rounded-2xl bg-slate-100 text-slate-500">
            <svg class="h-7 w-7"><use href="#i-cart"></use></svg>
          </span>
          <p class="mt-4 text-sm font-bold text-navy-900">Votre panier est vide</p>
          <p class="mt-1 max-w-xs text-xs leading-5 text-slate-500">Ajoutez des produits depuis le catalogue pour préparer votre prochaine commande.</p>
          <a href="{% url 'client_catalogue' %}" class="btn-secondary mt-4" @click="$store.cart.closeDrawer()">
            <svg class="icon-sm h-4 w-4"><use href="#i-grid"></use></svg> Parcourir le catalogue
          </a>
        </div>
      </template>

      <ul class="space-y-3">
        <template x-for="item in $store.cart.items" :key="item.code">
          <li class="flex gap-3 rounded-xl border border-slate-200/80 p-3">
            <div class="h-16 w-16 shrink-0 overflow-hidden rounded-lg border border-slate-100 bg-slate-50">
              <img :src="item.image" :alt="item.name" class="h-full w-full object-cover" width="64" height="64">
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <p class="truncate text-[13px] font-bold text-navy-900" x-text="item.name"></p>
                  <p class="truncate text-[11px] text-slate-500" x-text="item.form"></p>
                </div>
                <button type="button" class="grid h-6 w-6 shrink-0 place-items-center rounded-md text-slate-500 transition hover:bg-rose-50 hover:text-rose-600" @click="$store.cart.remove(item.code)" :aria-label="'Retirer ' + item.name">
                  <svg class="h-3.5 w-3.5"><use href="#i-trash"></use></svg>
                </button>
              </div>
              <div class="mt-2 flex items-center justify-between gap-2">
                <div class="inline-flex items-center rounded-lg border border-slate-200">
                  <button type="button" class="grid h-7 w-7 place-items-center rounded-l-lg text-slate-500 transition hover:bg-slate-50 hover:text-navy-900 disabled:opacity-40" @click="$store.cart.setQty(item.code, item.qty - 1)" :disabled="item.qty <= 1" aria-label="Diminuer la quantité">
                    <svg class="h-3.5 w-3.5"><use href="#i-minus"></use></svg>
                  </button>
                  <span class="w-8 text-center text-xs font-bold tabular-nums text-navy-900" x-text="item.qty"></span>
                  <button type="button" class="grid h-7 w-7 place-items-center rounded-r-lg text-slate-500 transition hover:bg-slate-50 hover:text-navy-900 disabled:opacity-40" @click="$store.cart.setQty(item.code, item.qty + 1)" :disabled="item.qty >= item.stock" aria-label="Augmenter la quantité">
                    <svg class="h-3.5 w-3.5"><use href="#i-plus"></use></svg>
                  </button>
                </div>
                <p class="text-[13px] font-bold tabular-nums text-navy-900" x-text="money(item.price * item.qty)"></p>
              </div>
              <p x-cloak x-show="item.qty >= item.stock" class="mt-1.5 text-[10px] font-semibold text-amber-600">Stock maximum atteint pour ce produit</p>
            </div>
          </li>
        </template>
      </ul>
    </div>

    <footer class="border-t border-hairline bg-slate-50/70 px-5 py-4">
      <div class="flex items-center justify-between text-sm">
        <span class="font-semibold text-slate-600">Total HT</span>
        <span class="text-lg font-extrabold tabular-nums text-navy-900" x-text="money($store.cart.total)"></span>
      </div>
      <p class="mt-1 text-[11px] leading-5 text-slate-500">TVA 0 % — Produits pharmaceutiques. Livraison offerte dès {{ 150000|fcfa }}.</p>

      <p x-cloak x-show="$store.cart.error" x-text="$store.cart.error" class="mt-3 rounded-lg bg-rose-50 px-3 py-2 text-[11px] font-semibold text-rose-700 ring-1 ring-inset ring-rose-200/70"></p>

      <button
        type="button"
        class="btn-primary mt-3 h-11 w-full"
        @click="$store.cart.submit()"
        :disabled="$store.cart.saving || $store.cart.items.length === 0"
      >
        <svg x-cloak x-show="$store.cart.saving" class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".25" stroke-width="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        <svg x-cloak x-show="!$store.cart.saving" class="icon-sm h-4 w-4"><use href="#i-check-circle"></use></svg>
        <span x-text="$store.cart.saving ? 'Envoi en cours…' : 'Valider la commande'">Valider la commande</span>
      </button>
      <p class="mt-2 text-center text-[10px] text-slate-500">La commande est enregistrée avec le statut « En attente ».</p>
    </footer>
  </aside>
</div>
